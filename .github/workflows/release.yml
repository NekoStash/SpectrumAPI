name: Signed Canary and Release

on:
  push:
    # The job gate below uses the repository's actual default branch, not an
    # assumed main/master name. All other branches are denied before any secret.
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: signed-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  signed:
    if: >-
      github.repository == 'NekoStash/SpectrumAPI' &&
      ((github.event_name == 'push' &&
        (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) ||
         github.ref == 'refs/heads/canary' || startsWith(github.ref, 'refs/tags/v'))) ||
       (github.event_name == 'workflow_dispatch' &&
        (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) ||
         github.ref == 'refs/heads/canary')))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: gradle/actions/setup-gradle@017a9effdb900e5b5b2fddfb590a105619dca3c3 # v4.4.2, GitHub Docs verified
        with:
          # Never persist a signing build's Gradle user home/configuration cache.
          cache-disabled: true
      - name: Install and verify exact Android packages
        run: python tools/ci.py prepare-sdk
      - name: Restore and validate the one production signing identity
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          RELEASE_CERT_SHA256: ${{ vars.RELEASE_CERT_SHA256 }}
        run: python tools/ci.py restore-key
      - name: Signed R8 Release (ordinary Canary uses the same required key)
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          RELEASE_CERT_SHA256: ${{ vars.RELEASE_CERT_SHA256 }}
        run: >-
          python tools/build.py --variant release --platform-link-mode stubs
          --cmake "$ANDROID_HOME/cmake/3.22.1/bin/cmake"
      - name: Stage only this invocation's verified production artifacts
        run: python tools/ci.py stage-dist --channel release
      - name: Remove signing material, even on failure
        if: always()
        run: python tools/ci.py cleanup-key
      - name: Upload signed Canary or tag artifacts
        uses: actions/upload-artifact@v4
        with:
          name: spectrum-${{ startsWith(github.ref, 'refs/tags/v') && 'release' || 'canary' }}-${{ github.run_number }}-${{ github.sha }}
          path: build/ci-upload/artifacts/*
          if-no-files-found: error
          retention-days: 30
      - name: Upload R8 mapping as an independent artifact
        uses: actions/upload-artifact@v4
        with:
          name: spectrum-mapping-${{ github.sha }}
          path: build/ci-upload/mapping/*
          if-no-files-found: error
          retention-days: 90
      - name: Upload allowlisted verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spectrum-release-reports-${{ github.sha }}
          path: |
            build/reports/spectrum/*.json
            manager/build/reports/lint-results-*.html
            manager/build/reports/lint-results-*.xml
          if-no-files-found: warn
          retention-days: 30
